name: terraform
on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  TF_VAR_wireguard_client_public_key: ${{ secrets.WIREGUARD_CLIENT_PUBLIC_KEY }}
  TF_VAR_ssh_public_key: ${{ secrets.ANSIBLE_SSH_PUBLIC_KEY }}
  TF_VAR_soar_webhook_token: ${{ secrets.SOAR_WEBHOOK_TOKEN }}
  TF_VAR_kibana_api_key: ${{ secrets.KIBANA_API_KEY }}
  TF_VAR_kibana_url: ${{ secrets.KIBANA_URL }}

jobs:
  plan:
    runs-on: [self-hosted, linux, innovatech]
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - run: terraform fmt -check
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan -input=false
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, innovatech]
    environment: production        # add required reviewers in GitHub = manual approval gate
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - run: terraform init
      - run: terraform apply -input=false tfplan
