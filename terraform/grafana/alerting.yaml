apiVersion: 1
contactPoints:
  - orgId: 1
    name: soar-webhook
    receivers:
      - uid: soar-webhook
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://soar.innovatech.internal:8080/webhook
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${SOAR_TOKEN}
policies:
  - orgId: 1
    receiver: soar-webhook
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
groups:
  - orgId: 1
    name: security-logs
    folder: Security
    interval: 1m
    rules:
      - uid: suricata-alert
        title: Suricata IDS alert
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: high
          source: suricata
          type: ids_alert
        annotations:
          summary: Suricata raised an alert
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: 'sum(count_over_time({job="suricata"} |= `"event_type":"alert"` [5m]))'
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: ssh-failures
        title: Repeated failed SSH logins
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: medium
          source: auth
          type: ssh_bruteforce
        annotations:
          summary: More than 5 failed SSH logins in 5 minutes
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: 'sum(count_over_time({job="auth"} |= "Failed password" [5m]))'
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]